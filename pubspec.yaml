name: _
publish_to: none
environment:
  sdk: ^3.12.0
# adaptive_chat_server_dart is deliberately NOT a workspace member: pub
# workspaces resolve as one unit, so a Flutter-free package sitting in this
# list still forces anything resolving it (including CI) to install the full
# Flutter SDK just to satisfy the Flutter packages below. It has its own
# standalone pubspec.yaml/pubspec.lock instead — see
# adaptive_chat_server_dart/pubspec.yaml and
# docs/superpowers/specs/2026-08-09-adaptive-chat-server-dart-design.md.
workspace:
  - packages/flutter_adaptive_cards_fs
  - packages/flutter_adaptive_cards_host_fs
  - packages/flutter_adaptive_cards_test_support
  - packages/flutter_adaptive_charts_fs
  - packages/flutter_adaptive_template_fs
  - widgetbook
  - adaptive_explorer
  - adaptive_chat_client
