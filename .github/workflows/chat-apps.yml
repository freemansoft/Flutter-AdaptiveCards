# Runs the Adaptive Chat demo tests: the Flutter client (adaptive_chat_client)
# and the Dart backend (adaptive_chat_server_dart). These live outside the
# published packages, so they are kept in their own workflow rather than the
# package matrix in packages-test.yml.
#
# Markdown here is checked by this workflow, not packages-validate.yml: that
# one's `check:md` covers docs/**, packages/**, and the root *.md — the
# published docs, packages, and front door — and deliberately excludes these
# demo apps, which `check:md:chat` exists to cover.
#
# Dart formatting splits the same way: packages-validate.yml's `dart-format`
# job covers packages/ and tool/, so these two apps are checked here instead —
# as a step in each app's own job, where its dependencies are already resolved.
#
# Scoped `push` to main to avoid duplicate runs on branches with an open PR
# (matches packages-test.yml / packages-validate.yml).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  markdown-format:
    name: Adaptive Chat markdown format (Prettier)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Markdown formatting
        run: npm run check:md:chat

  client:
    name: Adaptive Chat client (Flutter)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: 3.44.0 # should sync with fvm version (.fvmrc)
          cache: true

      - run: dart --version
      - run: flutter --version

      # Resolve from the repo root: adaptive_chat_client is a workspace member,
      # so its dependencies are resolved by the root pub get (Flutter 3.6.0+
      # workspace feature), same as the package tests in packages-test.yml.
      - run: flutter pub get

      - name: Run adaptive_chat_client tests
        run: flutter test -r expanded
        working-directory: ./adaptive_chat_client

      # Formatting is checked inside the job that already resolved this app's
      # dependencies, rather than in a `dart-format` job of its own like
      # packages-validate.yml has. `dart format` reads its config from
      # analysis_options.yaml, which here `include:`s package:very_good_analysis
      # -- unresolved, the include fails and the formatter silently falls back
      # to its own defaults, reporting unrelated files as changed. The two chat
      # apps resolve differently (this one via the root workspace, the server
      # standalone), so a shared job would have to duplicate both setups.
      #
      # Runs after the tests so a formatting failure never hides a test result.
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed adaptive_chat_client/

  dart-server:
    name: Adaptive Chat server (Dart)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          # Pinned to the Dart that Flutter 3.44.0 ships, i.e. what `fvm dart`
          # runs locally (.fvmrc), matching the flutter-version pins in every
          # other job. This was `stable` — fine while the job only ran tests,
          # but it now also runs `dart format`, and formatter output is
          # SDK-dependent: the day `stable` moves ahead of the pin and changes
          # the formatter, CI fails on code that is clean locally and no local
          # command reproduces it. Bump this with .fvmrc, in its own commit.
          sdk: "3.12.0" # should sync with the Dart in fvm's Flutter (.fvmrc)

      - run: dart --version

      # adaptive_chat_server_dart is deliberately NOT a member of the root
      # pub workspace (see its pubspec.yaml), so it resolves standalone here
      # — a plain Dart SDK is enough, no Flutter install needed for this job.
      - name: Install dependencies
        run: dart pub get
        working-directory: ./adaptive_chat_server_dart

      - name: Run adaptive_chat_server_dart tests
        run: dart test
        working-directory: ./adaptive_chat_server_dart

      # No model runs here -- this checks the *artifacts* a hand-run probe
      # left behind, which is the only part of tool/model_probes/ CI can
      # police without an Ollama. It catches three things that otherwise go
      # unnoticed: a figure in ModelBehavior.md that disagrees with the
      # recorded run behind it, a result measured against a prompt asset that
      # has since been edited (fatal only for models launch.json launches),
      # and a launched model with a probe never run against it.
      - name: Check recorded probe results
        run: dart run tool/model_probes/check_results.dart
        working-directory: ./adaptive_chat_server_dart

      # See the note on the client job's formatting step. Covers lib/, bin/,
      # test/, and tool/ -- tool/model_probes/ is hand-run tooling, but it is
      # still source we read and edit, so it is held to the same bar.
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed .
        working-directory: ./adaptive_chat_server_dart
